version: '3.1'
services:
    webserver:
        image: 'nginx:alpine'
        container_name: r2-database
        working_dir: /app
        volumes:
            - '.:/app'
            - '~/r2-projetos/r2-docker-compose-config/8.2/phpdocker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf'
        ports:
            - '${APP_PORT:-80}:80'
        networks:
            - app-networks
    php-fpm:
        build: ~/r2-projetos/r2-docker-compose-config/8.2/phpdocker/php-fpm-clean
        working_dir: /app
        container_name: php8.2-r2-database
        volumes:
            - '.:/app'
            - '~/r2-projetos/r2-docker-compose-config/8.2/phpdocker/php-fpm-clean/php-ini-overrides.ini:/etc/php/8.2/fpm/conf.d/99-overrides.ini'
        networks:
            - app-networks
networks:
    app-networks:
        driver: bridge
